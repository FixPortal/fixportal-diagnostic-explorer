# Report-only mutation lane: 80/70 classify the score; break 0 keeps the score informational.
name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  stryker:
    name: Stryker Mutation
    runs-on: ubuntu-latest
    # Same 1004 mutants finished in 53 minutes on 2026-09-20. The 60-minute
    # cap cancelled the 2026-09-27 rerun while they were still running.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DiagnosticExplorer.slnx
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tool restore
        run: dotnet tool restore

      - name: Mutation tests
        working-directory: tests/DiagnosticService.UnitTests
        run: dotnet stryker --config-file stryker-config.json
        env:
          # No Mongo service on this job. The integration tests skip when this is
          # set; they still run in the CI backend job, which has the service.
          # Stryker 4.16 aborts if the initial pass reports any failure, and these
          # tests must not run once per mutant against one shared database.
          DIAG_SKIP_MONGO_INTEGRATION: "1"

      - name: Summarize mutation report
        if: always()
        shell: pwsh
        run: |
          $latest = Get-ChildItem tests/DiagnosticService.UnitTests/StrykerOutput -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw "No StrykerOutput directory found." }
          $report = Join-Path $latest.FullName 'reports/mutation-report.json'
          $jsonSummary = Join-Path $latest.FullName 'reports/mutation-summary.json'
          $mdSummary = Join-Path $latest.FullName 'reports/mutation-summary.md'
          ./scripts/summarize-stryker.ps1 -ReportPath $report -JsonOutputPath $jsonSummary -MarkdownOutputPath $mdSummary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-summary
          path: tests/DiagnosticService.UnitTests/StrykerOutput/**/reports/mutation-summary.*

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: tests/DiagnosticService.UnitTests/StrykerOutput/**
          if-no-files-found: error
