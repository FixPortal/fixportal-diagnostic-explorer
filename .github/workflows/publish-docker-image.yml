# Build and publish the DiagnosticExplorer container image to GitHub
# Container Registry (ghcr.io/<owner>/<repo>).
#
# Triggers:
#   - push to main                       -> publish, tagged `latest` + `sha-<short>` + `main`
#   - push of a v*.*.* git tag           -> publish, tagged with the semver
#   - workflow_dispatch                  -> publish on demand from any ref
#   - pull_request against main          -> build only (no push) to validate
#                                           the Dockerfile / SPA build still works
#
# Authentication: the built-in GITHUB_TOKEN with `packages: write` permission;
# no external secrets required.
#
# Image lives at: ghcr.io/${{ github.repository_owner }}/diagnostic-explorer
# Visibility inherits the source repo on first publish (public repo ->
# public package, private repo -> private package). Override at any
# time from the package's settings page on GitHub.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/diagnostic-explorer

jobs:
  build-and-push:
    name: Publish Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      # A ref gate on refs/tags/v* proves the ref's SHAPE, never that the commit was
      # reviewed. `git push origin v1.2.3` puts the tag on whatever commit you name,
      # including one that never opened a PR, and this job would then build and publish
      # it to GHCR. Rulesets target branches; a branch ruleset does not constrain tags,
      # and this repository has no tag-target ruleset. Assert reachability instead: it
      # fails closed and is visible in the diff. Public repo, so the fetch needs no
      # token even though checkout ran with persist-credentials: false.
      # TAG PUSHES ONLY. This workflow also runs on pull_request and on push to main.
      # On a pull_request GITHUB_SHA is the refs/pull/N/merge commit, which is by
      # construction NOT an ancestor of main, so an ungated assertion would fail every
      # PR in this repository. On a main push the check is redundant.
      - name: Assert the tagged commit is reachable from main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Full fetch of main, not --depth: the tag may name an older main commit, and a
          # shallow fetch leaves merge-base no shared history to walk.
          git fetch --no-tags origin main
          # PEEL the ref first. For an ANNOTATED or signed tag, GITHUB_SHA is the tag
          # OBJECT's sha, not a commit, and merge-base then fails with a confusing
          # message rather than the intended one. `^{commit}` peels a tag object and is
          # the identity for a plain commit sha, so this is correct either way.
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD; then
            echo "::error::Tag '${GITHUB_REF_NAME}' names a commit that is not reachable from main. Only reviewed, merged commits may be released."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches Docker/Dockerfile's node:22-alpine build stage (pinned there for Angular's
          # LTS requirement) -- validating on a different major than the image is built on lets a
          # green check precede a build that behaves differently on the shipped runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: diagnostics-web/package-lock.json

      - name: Frontend validation
        working-directory: diagnostics-web
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Set up Docker Buildx
        # Blacksmith v2 caching requires a Blacksmith runner and persistent builder. This job is
        # still on ubuntu-latest, so retain the GHA cache until a runner migration is benchmarked.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}
