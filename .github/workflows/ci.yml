name: ci

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/diagnostic-explorer

concurrency:
  group: ci-${{ github.ref }}
  # A superseding run must not interrupt image publication.
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # C1/C2: MongoRetroLogger integration tests need a real MongoDB to exercise insert,
    # duplicate-key handling and query execution/ordering/limit/batching, which a mocked
    # driver cannot prove. Exposed on the driver's default port so the tests need no
    # connection-string wiring beyond what MongoRetroLoggerIntegrationTests already assumes
    # for a local dev mongod.
    # The image is Google's mirror.gcr.io pull-through cache of the official mongo:7, digest
    # kept identical — an anonymous Docker Hub service pull has timed out in this estate
    # before (observatory PR #7) and the runner's built-in retry is the only retry for
    # services. Not ECR Public: its anonymous pulls are capped per source IP and shared
    # GitHub-hosted runner IPs hit "toomanyrequests: Data limit exceeded" (run 36485942840,
    # failed twice). The health
    # check mirrors Docker/compose-with-existing-image.yaml: the runner waits for mongod
    # to answer ping before any step runs, so Test does not rely on the earlier steps
    # happening to take long enough.
    services:
      mongo:
        image: mirror.gcr.io/library/mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore DiagnosticExplorer.slnx
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build DiagnosticExplorer.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution DiagnosticExplorer.slnx
          --configuration Release
          --no-build
          --report-xunit-trx
          --results-directory ./TestResults
          --timeout 5m

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: diagnostics-web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true
      - uses: actions/setup-node@v7
        with:
          # Match the Docker image's Node major.
          node-version: 22
          cache: npm
          cache-dependency-path: diagnostics-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Image publication follows the gate; it cannot feed the gate it depends on.
      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: 'build-and-push'
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

      - name: Test repository workflow contracts
        run: python3 .github/scripts/test_workflow_contract.py

      - name: Assert canonical asset copies match the committed manifest
        run: python3 .github/scripts/assert_canonical_assets.py

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [backend, frontend, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "Upstream results: $RESULTS"
          exit 1

  build-and-push:
    name: Publish Image (GHCR)
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      # A ref gate on refs/tags/v* proves the ref's SHAPE, never that the commit was
      # reviewed. `git push origin v1.2.3` puts the tag on whatever commit you name,
      # including one that never opened a PR, and this job would then build and publish
      # it to GHCR. Rulesets target branches; a branch ruleset does not constrain tags,
      # and this repository has no tag-target ruleset. Assert reachability instead: it
      # fails closed and is visible in the diff. Public repo, so the fetch needs no
      # token even though checkout ran with persist-credentials: false.
      # TAG PUSHES ONLY. This workflow also runs on pull_request and on push to main.
      # On a pull_request GITHUB_SHA is the refs/pull/N/merge commit, which is by
      # construction NOT an ancestor of main, so an ungated assertion would fail every
      # PR in this repository. On a main push the check is redundant.
      - name: Assert the tagged commit is reachable from main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Full fetch of main, not --depth: the tag may name an older main commit, and a
          # shallow fetch leaves merge-base no shared history to walk.
          git fetch --no-tags origin main
          # PEEL the ref first. For an ANNOTATED or signed tag, GITHUB_SHA is the tag
          # OBJECT's sha, not a commit, and merge-base then fails with a confusing
          # message rather than the intended one. `^{commit}` peels a tag object and is
          # the identity for a plain commit sha, so this is correct either way.
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD; then
            echo "::error::Tag '${GITHUB_REF_NAME}' names a commit that is not reachable from main. Only reviewed, merged commits may be released."
            exit 1
          fi

      - name: Set up Docker Buildx
        # Blacksmith v2 caching requires a Blacksmith runner and persistent builder. This job is
        # still on ubuntu-latest, so retain the GHA cache until a runner migration is benchmarked.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}
